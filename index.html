<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Felicidades Graduados!</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

  <!-- VENTANA FLOTANTE PARA ESCRIBIR EL NOMBRE -->
  <div id="modal-graduado" class="modal-graduado">
    <div class="tarjeta-registro">
      <h3>🎓 ¡Llegó el día de la Graduación!</h3>
      <p>Escribe el nombre del graduado o graduada:</p>
      <input type="text" id="nombre-graduado" placeholder="Escribe el nombre aquí...">
      <button id="btn-celebrar">¡Celebrar! 🎉</button>
    </div>
  </div>

  <!-- CAPA PARA LOS FUEGOS ARTIFICIALES -->
  <canvas id="canvas-pirotecnia"></canvas>

  <!-- TARJETA DE RECONOCIMIENTO PRINCIPAL -->
  <div class="tarjeta-diploma">
    <div class="sombrero-3d">
      <div class="rombo-superior"></div>
      <div class="base-cilindro"></div>
      <div class="borla-hilo"></div>
      <div class="borla-gota"></div>
    </div>
    
    <h1>¡MUCHAS FELICIDADES!</h1>
    <h2 id="texto-nombre">GRADUADO</h2>
    <p class="mensaje-inspirador">Por haber concluido con éxito el curso. ¡Sigan aprendiendo y practicando cada día!</p>
    
    <button id="btn-otro" class="btn-otro">Celebrar a alguien más 🔄</button>
  </div>

</body>
</html>
